      # 7. Publish the raw .exe directly to the GitHub Releases page
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: "Dependabot Auto-Build: ${{ steps.tag.outputs.version }}"
          body: |
            Automated WinForms v4.8 build generated from Dependabot updates.
            
            **Authors / Developers:** GAMELASTER and Catten Type Guy
            
            Review the dependency updates in PR #${{ github.event.pull_request.number }}.
          draft: false
          prerelease: false # Changed to false so it is marked as a full, stable release!
          files: ChilledWindows/bin/Release/ChilledWindows.exe
